name: Deploy Project ARL to GitHub Pages

# Builds project-arl/ and publishes dist/ to the gh-pages branch, which
# GitHub Pages serves (Settings → Pages → Deploy from a branch → gh-pages / root).
on:
  push:
    branches: [main]
    paths:
      - 'project-arl/**'
      - '.github/workflows/deploy-project-arl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-project-arl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-arl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-arl/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Publish dist/ to gh-pages
        working-directory: project-arl/dist
        env:
          SHA: ${{ github.sha }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Project ARL from ${SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
