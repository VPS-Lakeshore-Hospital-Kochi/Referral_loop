name: Deploy Project ARL to GitHub Pages

# Builds project-arl/ and publishes dist/ to the gh-pages branch of this repo.
#
# This repo is private, so it can't serve GitHub Pages on the org's plan. The
# built site (and only the built site: no source, no history) is also pushed
# to a public repo that serves it. Set up once:
#   - create the public repo (default sameeraj89/arl-demo, or set the
#     ARL_PAGES_REPO repository variable to another owner/name)
#   - add a fine-grained token with Contents: read & write on that repo only,
#     as the ARL_PAGES_TOKEN secret here
#   - in the public repo: Settings → Pages → Deploy from a branch → gh-pages / root
# Without the secret, the run fails with a message saying what to fix.
on:
  push:
    branches: [main]
    paths:
      - 'project-arl/**'
      - '.github/workflows/deploy-project-arl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-project-arl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-arl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-arl/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Publish dist/ to gh-pages
        working-directory: project-arl/dist
        env:
          SHA: ${{ github.sha }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Project ARL from ${SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Check the public Pages token
        # Reports what reached the job (never the values) and fails clearly
        # instead of skipping quietly when the token is missing.
        env:
          HAS_SECRET: ${{ secrets.ARL_PAGES_TOKEN != '' }}
          HAS_VARIABLE_SAME_NAME: ${{ vars.ARL_PAGES_TOKEN != '' }}
          HAS_ORG_STYLE_NAME: ${{ secrets.PAGES_TOKEN != '' || secrets.GH_PAGES_TOKEN != '' || secrets.ARL_TOKEN != '' }}
          PAGES_REPO: ${{ vars.ARL_PAGES_REPO || 'sameeraj89/arl-demo' }}
        run: |
          echo "Repository:                 $GITHUB_REPOSITORY"
          echo "Triggered by:               $GITHUB_EVENT_NAME"
          echo "Target public repo:         $PAGES_REPO"
          echo "Secret ARL_PAGES_TOKEN set: $HAS_SECRET"
          echo "Variable ARL_PAGES_TOKEN:   $HAS_VARIABLE_SAME_NAME"
          echo "Similar secret names set:   $HAS_ORG_STYLE_NAME"
          if [ "$HAS_SECRET" != "true" ]; then
            msg="ARL_PAGES_TOKEN secret not found by this workflow."
            if [ "$HAS_VARIABLE_SAME_NAME" = "true" ]; then
              msg="$msg It was added as a Variable, not a Secret: move it to Settings > Secrets and variables > Actions > Secrets."
            elif [ "$HAS_ORG_STYLE_NAME" = "true" ]; then
              msg="$msg A token exists under a different name (PAGES_TOKEN, GH_PAGES_TOKEN or ARL_TOKEN): rename it to ARL_PAGES_TOKEN."
            else
              msg="$msg Add it under Settings > Secrets and variables > Actions > Repository secrets (an organisation secret must list this repo under Repository access; environment secrets are not used)."
            fi
            echo "::error title=Public Pages token missing::$msg"
            exit 1
          fi

      - name: Publish the built site to the public Pages repo
        working-directory: project-arl/dist
        env:
          PAGES_TOKEN: ${{ secrets.ARL_PAGES_TOKEN }}
          PAGES_REPO: ${{ vars.ARL_PAGES_REPO || 'sameeraj89/arl-demo' }}
        run: |
          # Fresh single-commit history each time, so nothing from this repo leaks.
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Project ARL prototype"
          if ! git push -f "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git" gh-pages; then
            echo "::error title=Push to public repo failed::Could not push to ${PAGES_REPO}. Check the repo exists and the token has Contents: Read and write on it."
            exit 1
          fi
